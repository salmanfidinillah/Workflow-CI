name: MLflow CI Pipeline

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
    - name: Run actions/checkout@v3
      uses: actions/checkout@v3

    - name: Set up Python 3.12.7
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.7'

    - name: Check Env
      run: python -V && pip --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow==2.19.0 pandas scikit-learn

    - name: Run mlflow project
      working-directory: ./MLProject
      run: |
        mlflow run . -P n_estimators=100 --env-manager=local

    - name: Build Docker Model
      working-directory: ./MLProject
      run: |
        docker build -t ml-model-churn:latest .

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Tag Docker Image
      run: |
        docker tag ml-model-churn:latest ${{ secrets.DOCKER_USERNAME }}/ml-model-churn:latest

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/ml-model-churn:latest